[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semicalc"
version = "0.1.0"
description = "Semiconductor physics calculator: carriers, p-n junctions, diodes and MOSFETs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
semicalc = "semicalc.cli:main"

[tool.setuptools]
packages = ["semicalc"]
